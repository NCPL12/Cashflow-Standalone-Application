# Tally is read from the computer hosting Cashflow.
# For a different Tally computer, replace 127.0.0.1 with its LAN IP.
cashflow.tally.server.url=http://127.0.0.1:9000
# Blank uses Tally's current company. Enter the exact company name to pin it.
cashflow.tally.company-name=
cashflow.tally.sync.enabled=true
cashflow.tally.sync.initial-delay-ms=5000
cashflow.tally.sync.interval-ms=60000
# Other computers connect to this host on TCP 8081.
server.address=0.0.0.0
server.port=8081

# Authoritative group under Current Assets > Sundry Debtors
cashflow.tally.retention-group=Retention Amounts
